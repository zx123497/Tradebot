services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Kafka..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sp500.trades --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sp500.bars.1m --partitions 1 --replication-factor 1
        echo "Kafka topics ready:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: findata
      CLICKHOUSE_USER: findata
      CLICKHOUSE_PASSWORD: findata
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse/
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "findata", "--password", "findata", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  jobmanager:
    build:
      context: ../findata-flink
      dockerfile: Dockerfile
    image: findata-flink
    hostname: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sp500.trades
      KAFKA_BARS_TOPIC: sp500.bars.1m
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager

  taskmanager:
    build:
      context: ../findata-flink
      dockerfile: Dockerfile
    image: findata-flink
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      FLINK_KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sp500.trades
      KAFKA_BARS_TOPIC: sp500.bars.1m
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4

  flink-job-submitter:
    build:
      context: ../findata-flink
      dockerfile: Dockerfile
    image: findata-flink
    depends_on:
      - jobmanager
      - taskmanager
      - kafka
      - kafka-init
      - marquez
    command: /opt/flink/submit-job.sh
    environment:
      FLINK_KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sp500.trades
      KAFKA_BARS_TOPIC: sp500.bars.1m
      FLINK_KAFKA_GROUP: flink-bars-1m
      OPENLINEAGE_URL: http://marquez:5000
      OPENLINEAGE_NAMESPACE: tradebot
    restart: on-failure

  # OpenLineage backend + UI (API on host 5002 to avoid macOS AirPlay on 5000)
  marquez-db:
    image: postgres:14
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 10

  marquez:
    image: marquezproject/marquez:0.50.0
    ports:
      - "5002:5000"
      - "5001:5001"
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    depends_on:
      marquez-db:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    ports:
      - "3000:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    depends_on:
      - marquez

  producer:
    build:
      context: ..
      dockerfile: FinData/Dockerfile
    image: findata-python
    env_file:
      - .env
    environment:
      # Docker network endpoints (override host localhost values from .env)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_URL: http://marquez:5000
      OPENLINEAGE_NAMESPACE: tradebot
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      marquez:
        condition: service_started
    command: ["uv", "run", "--no-sync", "python", "main.py"]
    restart: unless-stopped

  consumer:
    build:
      context: ..
      dockerfile: FinData/Dockerfile
    image: findata-python
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      OPENLINEAGE_URL: http://marquez:5000
      OPENLINEAGE_NAMESPACE: tradebot
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      flink-job-submitter:
        condition: service_started
      marquez:
        condition: service_started
    command: ["uv", "run", "--no-sync", "python", "consumer.py"]
    restart: unless-stopped

volumes:
  clickhouse_data:
  marquez_db:
