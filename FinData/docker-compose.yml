services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Kafka..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sp500.trades --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sp500.bars.1m --partitions 1 --replication-factor 1
        echo "Kafka topics ready:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: findata
      CLICKHOUSE_USER: findata
      CLICKHOUSE_PASSWORD: findata
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse/
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "findata", "--password", "findata", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  jobmanager:
    build:
      context: ../findata-flink
      dockerfile: Dockerfile
    image: findata-flink
    hostname: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sp500.trades
      KAFKA_BARS_TOPIC: sp500.bars.1m
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager

  taskmanager:
    build:
      context: ../findata-flink
      dockerfile: Dockerfile
    image: findata-flink
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      FLINK_KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sp500.trades
      KAFKA_BARS_TOPIC: sp500.bars.1m
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4

  flink-job-submitter:
    build:
      context: ../findata-flink
      dockerfile: Dockerfile
    image: findata-flink
    depends_on:
      - jobmanager
      - taskmanager
      - kafka
      - kafka-init
    command: /opt/flink/submit-job.sh
    environment:
      FLINK_KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sp500.trades
      KAFKA_BARS_TOPIC: sp500.bars.1m
      FLINK_KAFKA_GROUP: flink-bars-1m
    restart: on-failure

volumes:
  clickhouse_data:
