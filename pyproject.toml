[project]
name = "tradebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "clickhouse-connect>=0.8.18",
    "dotenv>=0.9.9",
    "kafka-python>=2.2.15",
    "lxml>=6.1.1",
    "numpy>=1.24.4",
    "pandas>=2.3.3",
    "python-dotenv>=1.1.1",
    "requests>=2.32.0",
    "websocket-client>=1.9.0",
    "websockets>=14.0",
    "wikipedia>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
findata-producer = "findata.producer_app:main"
findata-consumer = "findata.consumer_app:main"
findata-mock-finnhub = "findata.mock_finnhub:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["FinData/src"]
include = ["findata*"]

[tool.pytest.ini_options]
testpaths = ["FinData/tests"]
pythonpath = ["FinData/src", "FinData/tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that require Docker infra (Kafka, Flink, ClickHouse)",
]

[tool.uv.workspace]
members = [
    "FinLab/backend",
]
