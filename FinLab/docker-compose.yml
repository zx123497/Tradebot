services:
  lab-api:
    build:
      context: ..
      dockerfile: FinLab/backend/Dockerfile
    image: finlab-api
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: findata
      CLICKHOUSE_PASSWORD: findata
      CLICKHOUSE_DATABASE: findata
      CLICKHOUSE_TABLE: bars_1m
      CLICKHOUSE_TRADES_TABLE: trades
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      SSE_POLL_INTERVAL_SEC: "5.0"
      SSE_TRADES_POLL_INTERVAL_SEC: "1.0"
    networks:
      - findata
    restart: unless-stopped

  lab-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: finlab-ui
    ports:
      - "3000:80"
    depends_on:
      - lab-api
    networks:
      - findata
    restart: unless-stopped

networks:
  findata:
    external: true
    name: findata_default
