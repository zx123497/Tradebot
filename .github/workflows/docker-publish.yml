name: Docker Hub

on:
  push:
    branches: [main]
    paths:
      - FinData/**
      - FinLab/**
      - findata-flink/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run pytest FinData/tests/unit -q

  publish:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: findata-python
            context: .
            file: FinData/Dockerfile
          - name: findata-flink
            context: findata-flink
            file: findata-flink/Dockerfile
          - name: finlab-api
            context: FinLab/backend
            file: FinLab/backend/Dockerfile
          - name: finlab-ui
            context: FinLab/frontend
            file: FinLab/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Require Docker Hub username
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "Set Actions variable or secret DOCKERHUB_USERNAME" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: publish
    if: vars.VM_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VM_PATH }}"
            git pull --ff-only origin main
            export IMAGE_TAG="${{ github.sha }}"
            export DOCKERHUB_USERNAME="${{ env.DOCKERHUB_USERNAME }}"
            make up-prod
            make lab-up-prod
