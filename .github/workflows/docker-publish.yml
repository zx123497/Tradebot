name: Docker Hub

on:
  push:
    branches: [main]
    paths:
      - FinData/**
      - FinLab/**
      - findata-flink/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run pytest FinData/tests/unit -q

  publish:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: findata-python
            context: .
            file: FinData/Dockerfile
          - name: findata-flink
            context: findata-flink
            file: findata-flink/Dockerfile
          - name: finlab-api
            context: FinLab/backend
            file: FinLab/backend/Dockerfile
          - name: finlab-ui
            context: FinLab/frontend
            file: FinLab/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Require Docker Hub username
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "Set Actions variable or secret DOCKERHUB_USERNAME" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: publish
    if: vars.VM_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Pull Hub images on VM via Cloudflare Access SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_PATH: ${{ secrets.VM_PATH }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          # Prevent cloudflared from trying to open a browser on the runner.
          BROWSER: /bin/false
        run: |
          set -euo pipefail
          : "${VM_HOST:?Set secret VM_HOST}"
          : "${VM_USER:?Set secret VM_USER}"
          : "${VM_SSH_KEY:?Set secret VM_SSH_KEY}"
          : "${VM_PATH:?Set secret VM_PATH}"
          : "${CF_ACCESS_CLIENT_ID:?Set secret CF_ACCESS_CLIENT_ID}"
          : "${CF_ACCESS_CLIENT_SECRET:?Set secret CF_ACCESS_CLIENT_SECRET}"
          : "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}"

          # Service token = docs Client ID / Client Secret (not the header names).
          # https://developers.cloudflare.com/cloudflare-one/access-controls/service-credentials/service-tokens/
          # Access app policy must be Action: Service Auth, or cloudflared opens a browser.
          CF_ACCESS_CLIENT_ID="${CF_ACCESS_CLIENT_ID#CF-Access-Client-Id: }"
          CF_ACCESS_CLIENT_SECRET="${CF_ACCESS_CLIENT_SECRET#CF-Access-Client-Secret: }"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' \
            '#!/bin/sh' \
            'exec cloudflared access ssh --hostname "$1" --id "$CF_ACCESS_CLIENT_ID" --secret "$CF_ACCESS_CLIENT_SECRET"' \
            > ~/.ssh/cf-access-proxy
          chmod 700 ~/.ssh/cf-access-proxy

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o IdentityFile="$HOME/.ssh/deploy_key" \
            -o ProxyCommand="$HOME/.ssh/cf-access-proxy %h" \
            "${VM_USER}@${VM_HOST}" \
            "set -euo pipefail
            cd $(printf '%q' "$VM_PATH")
            git pull --ff-only origin main
            export IMAGE_TAG=$(printf '%q' "$IMAGE_TAG")
            export DOCKERHUB_USERNAME=$(printf '%q' "$DOCKERHUB_USERNAME")
            make up-prod
            make lab-up-prod"

